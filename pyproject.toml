[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pochishappy"
version = "0.1.0"
description = "Make your SHAP analysis happy — Pochi explains it all with a wagging tail!"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "shap>=0.51.0",
    "numba>=0.65 ; platform_machine != 'x86_64' or sys_platform != 'darwin'",
    "torch>=2.11",
    "torchvision>=0.26",
    "matplotlib>=3.10",
]

[project.scripts]
pochi = "pochishappy.cli:main"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.uv]
package = true

[dependency-groups]
dev = [
    "black>=25.12.0",
    "isort>=7.0.0",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pydocstyle>=6.3.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -m 'not slow'"
markers = [
    "slow: 数秒以上かかるテスト. SHAP 計算など. デフォルトでスキップされ, CI / 手動で -m slow 指定時のみ実行される",
]
